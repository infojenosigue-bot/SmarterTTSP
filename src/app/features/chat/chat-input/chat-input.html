<div class="p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
    <div
        class="relative max-w-4xl mx-auto rounded-xl bg-slate-800/50 backdrop-blur-md border border-slate-700/50 shadow-lg focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/30 transition-all">

        <!-- Textarea -->
        <textarea [(ngModel)]="messageText" (keydown)="onKeyDown($event)" placeholder="Message Jenox AI..."
            class="w-full bg-transparent border-0 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:ring-0 resize-none min-h-[56px] max-h-[200px] custom-scrollbar"></textarea>

        <!-- Bottom Actions -->
        <div class="flex items-center justify-between px-2 pb-2">
            <!-- Left: Attachments -->
            <div class="flex items-center gap-1">
                <button class="p-2 rounded-lg hover:bg-white/10 text-slate-400 hover:text-slate-200 transition-colors"
                    title="Attach file">
                    <lucide-icon [img]="icons.Paperclip" class="w-5 h-5"></lucide-icon>
                </button>
                <button class="p-2 rounded-lg hover:bg-white/10 text-slate-400 hover:text-slate-200 transition-colors"
                    title="Voice Input">
                    <lucide-icon [img]="icons.Mic" class="w-5 h-5"></lucide-icon>
                </button>
            </div>

            <!-- Right: Send -->
            <div class="flex items-center gap-2">
                <div class="text-xs text-slate-500 px-2 select-none">
                    {{ messageText.length }} / 4000
                </div>
                <button (click)="onSend()" [disabled]="!messageText.trim()"
                    class="p-2 rounded-lg bg-blue-600 text-white shadow-lg hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-700 transition-all">
                    <lucide-icon [img]="icons.Send" class="w-4 h-4"></lucide-icon>
                </button>
            </div>
        </div>
    </div>

    <div class="text-center mt-2">
        <p class="text-[10px] text-slate-500">AI can make mistakes. Verify important information.</p>
    </div>
</div>
