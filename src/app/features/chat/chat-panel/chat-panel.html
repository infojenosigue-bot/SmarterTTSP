<div class="flex flex-col h-full relative">

    <!-- Header -->
    <app-chat-header></app-chat-header>

    <!-- Messages Area -->
    <div #scrollContainer class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pb-4 scroll-smooth">

        <!-- Empty State -->
        <div *ngIf="(messages$ | async)?.length === 0"
            class="flex-1 flex flex-col items-center justify-center text-center p-8 opacity-50">
            <div class="w-16 h-16 rounded-2xl bg-slate-800 mb-4 flex items-center justify-center">
                <span class="text-3xl">👋</span>
            </div>
            <h3 class="text-xl font-bold text-slate-200 mb-2">Welcome to Smarter TTSP</h3>
            <p class="text-slate-400 max-w-md">Start a new conversation or select an existing one from the sidebar. I
                have access to corporate billing, engineering SOPs, and employee data.</p>
        </div>

        <!-- Message List -->
        <app-chat-message *ngFor="let msg of messages$ | async" [message]="msg"></app-chat-message>

        <!-- Typing Indicator -->
        <div *ngIf="isLoading$ | async" class="flex gap-4 p-4 pl-16">
            <div class="flex gap-1">
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
            </div>
        </div>

    </div>

    <!-- Input Area -->
    <app-chat-input (sendMessage)="sendMessage($event)" class="sticky bottom-0 z-20"></app-chat-input>

</div>
