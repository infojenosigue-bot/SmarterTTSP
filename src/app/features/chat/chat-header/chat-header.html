<div
    class="h-16 border-b border-slate-700/50 bg-slate-900/50 backdrop-blur-md flex items-center justify-between px-6 sticky top-0 z-10">

    <!-- Left: Title & Model -->
    <div class="flex items-center gap-4">
        <div class="flex flex-col">
            <h2 class="text-base font-semibold text-slate-100 flex items-center gap-2">
                {{ title }}
            </h2>
            <div
                class="flex items-center gap-1.5 text-xs text-blue-400 cursor-pointer hover:text-blue-300 transition-colors">
                <lucide-icon [img]="icons.Sparkles" class="w-3 h-3"></lucide-icon>
                <span class="font-medium">{{ model }}</span>
                <lucide-icon [img]="icons.ChevronDown" class="w-3 h-3"></lucide-icon>
            </div>
        </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2">
        <button class="p-2 rounded-lg hover:bg-white/10 text-slate-400 hover:text-slate-200 transition-colors">
            <lucide-icon [img]="icons.Settings" class="w-5 h-5"></lucide-icon>
        </button>
    </div>
</div>
