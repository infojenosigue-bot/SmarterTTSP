<div
    class="h-16 border-b border-slate-700/50 bg-slate-900/50 backdrop-blur-md flex items-center justify-between px-6 sticky top-0 z-10">

    <!-- Left: Title & Model -->
    <div class="flex items-center gap-4">
        <div class="flex flex-col">
            <h2 class="text-base font-semibold text-slate-100 flex items-center gap-2">
                {{ title }}
            </h2>
            <div class="relative">
                <div (click)="toggleModelDropdown()"
                    class="flex items-center gap-1.5 text-xs text-blue-400 cursor-pointer hover:text-blue-300 transition-colors select-none">
                    <lucide-icon [img]="icons.Sparkles" class="w-3 h-3"></lucide-icon>
                    <span class="font-medium">{{ selectedModel?.name || 'Select Model' }}</span>
                    <lucide-icon [img]="icons.ChevronDown" class="w-3 h-3 transition-transform duration-200"
                        [class.rotate-180]="showModelDropdown"></lucide-icon>
                </div>

                <!-- Dropdown Menu -->
                <div *ngIf="showModelDropdown"
                    class="absolute top-full left-0 mt-2 w-64 bg-slate-800 border border-slate-700/50 rounded-lg shadow-xl overflow-hidden z-50 animate-in fade-in zoom-in-95 duration-100">
                    <div class="p-1">
                        <div class="px-2 py-1.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            Model
                        </div>
                        <button *ngFor="let m of models" (click)="selectModel(m)"
                            class="w-full text-left px-2 py-2 rounded-md hover:bg-slate-700/50 flex items-start gap-3 group transition-colors"
                            [class.bg-slate-700-30]="selectedModel?.id === m.id">
                            <div class="p-1.5 rounded bg-slate-700/50 text-slate-300 group-hover:text-blue-400">
                                <lucide-icon [img]="icons.Bot" class="w-4 h-4"></lucide-icon>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between">
                                    <span class="text-sm font-medium text-slate-200">{{ m.name }}</span>
                                    <lucide-icon *ngIf="selectedModel?.id === m.id" [img]="icons.Check"
                                        class="w-3.5 h-3.5 text-blue-400"></lucide-icon>
                                </div>
                                <p class="text-xs text-slate-400 truncate">{{ m.description }}</p>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Overlay to close dropdown -->
                <div *ngIf="showModelDropdown" (click)="showModelDropdown = false" class="fixed inset-0 z-40"
                    style="background: transparent; cursor: default;"></div>
            </div>
        </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 relative">
        <button (click)="toggleSettingsDropdown()"
            class="p-2 rounded-lg hover:bg-white/10 text-slate-400 hover:text-slate-200 transition-colors"
            [class.bg-white-10]="showSettingsDropdown" [class.text-slate-200]="showSettingsDropdown">
            <lucide-icon [img]="icons.Settings" class="w-5 h-5"></lucide-icon>
        </button>

        <!-- Settings Dropdown -->
        <div *ngIf="showSettingsDropdown"
            class="absolute top-full right-0 mt-2 w-72 bg-slate-800 border border-slate-700/50 rounded-xl shadow-2xl overflow-hidden z-50 animate-in fade-in zoom-in-95 duration-100 origin-top-right">

            <!-- Header -->
            <div class="px-4 py-3 border-b border-slate-700/50 bg-slate-800/50">
                <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <lucide-icon [img]="icons.Settings2" class="w-4 h-4 text-blue-400"></lucide-icon>
                    Chat Settings
                </h3>
            </div>

            <!-- Content -->
            <div class="p-2">
                <!-- MCP Section -->
                <div class="px-4 py-3 text-sm text-slate-400 text-center italic">
                    No settings available yet.
                </div>
            </div>

            <!-- Footer/Info -->
            <div class="px-4 py-3 bg-slate-900/30 border-t border-slate-700/50 text-xs text-slate-500 text-center">
                More settings coming soon
            </div>
        </div>

        <!-- Overlay to close dropdown -->
        <div *ngIf="showSettingsDropdown" (click)="showSettingsDropdown = false" class="fixed inset-0 z-40"
            style="background: transparent; cursor: default;"></div>
    </div>
</div>
