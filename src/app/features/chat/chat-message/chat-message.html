<div class="flex gap-4 p-4 hover:bg-white/5 transition-colors group" [class.flex-row-reverse]="message.role === 'user'">

    <!-- Avatar -->
    <div class="flex-shrink-0 mt-1">
        <div *ngIf="message.role === 'assistant'"
            class="w-10 h-10 rounded-xl bg-transparent flex items-center justify-center">
            <!-- Grok style is often just the icon or simple avatar -->
            <lucide-icon [img]="icons.Bot" class="w-6 h-6 text-white"></lucide-icon>
        </div>
        <div *ngIf="message.role === 'user'"
            class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center border border-slate-600">
            <lucide-icon [img]="icons.User" class="w-5 h-5 text-slate-300"></lucide-icon>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col max-w-[85%]" [class.items-end]="message.role === 'user'">

        <!-- Meta -->
        <div class="flex items-center gap-2 mb-1" [class.flex-row-reverse]="message.role === 'user'">
            <span class="font-bold text-base text-slate-200" *ngIf="message.role === 'assistant'">Jenox</span>
            <span class="font-bold text-base text-slate-200" *ngIf="message.role === 'user'">You</span>
        </div>

        <!-- Bubble / Text -->
        <div class="text-[15px] leading-7 text-slate-200" [class.bg-[#1e1e1e]]="message.role === 'user'"
            [class.px-5]="message.role === 'user'" [class.py-3]="message.role === 'user'"
            [class.rounded-2xl]="message.role === 'user'" [class.text-white]="message.role === 'user'"
            [class.w-full]="message.role === 'assistant'">

            <!-- User Message: Simple Text -->
            <div *ngIf="message.role === 'user'">
                {{ message.content }}
            </div>

            <!-- AI Message: Markdown -->
            <div *ngIf="message.role === 'assistant'" class="markdown-body">
                <markdown [data]="message.content"></markdown>
            </div>
        </div>

        <!-- Actions (Assistant Only) -->
        <div *ngIf="message.role === 'assistant'"
            class="mt-2 flex items-center gap-4 opacity-0 group-hover:opacity-100 transition-opacity pl-1">
            <button class="flex items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors" title="Copy">
                <lucide-icon [img]="icons.Copy" class="w-4 h-4"></lucide-icon>
            </button>
            <button class="flex items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors"
                title="Helpful">
                <lucide-icon [img]="icons.ThumbsUp" class="w-4 h-4"></lucide-icon>
            </button>
            <button class="flex items-center gap-1 text-slate-500 hover:text-slate-300 transition-colors"
                title="Not Helpful">
                <lucide-icon [img]="icons.ThumbsDown" class="w-4 h-4"></lucide-icon>
            </button>
        </div>

    </div>
</div>
