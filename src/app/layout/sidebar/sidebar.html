<div class="flex flex-col h-full bg-slate-900/50 backdrop-blur-xl border-r border-slate-700/50">

    <!-- Header / Logo -->
    <div class="p-4 flex items-center gap-3 border-b border-white/5">
        <div
            class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <span class="text-white font-bold text-lg">AI</span>
        </div>
        <span class="font-bold text-slate-100 tracking-tight text-lg">Smart TTSP</span>
    </div>

    <!-- New Chat Button -->
    <div class="px-3 py-4">
        <button (click)="createNewChat()"
            class="w-full flex items-center gap-2 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white px-4 py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 group border border-blue-400/20">
            <lucide-icon [img]="icons.Plus" class="w-5 h-5 transition-transform group-hover:rotate-90"></lucide-icon>
            <span class="font-medium">New Chat</span>
        </button>
    </div>

    <!-- Search -->
    <div class="px-3 pb-2">
        <div class="relative group">
            <lucide-icon [img]="icons.Search"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-blue-400 transition-colors"></lucide-icon>
            <input type="text" placeholder="Search chats..."
                class="w-full bg-slate-950/50 border border-slate-700/50 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all">
        </div>
    </div>

    <!-- Session List -->
    <div class="flex-1 overflow-y-auto py-2 px-2 custom-scrollbar">
        <div class="text-xs font-semibold text-slate-500 px-3 py-2 uppercase tracking-wider">Recent</div>

        <div *ngFor="let session of sessions$ | async" (click)="selectSession(session.id)"
            [class.bg-white_5]="(activeSessionId$ | async) === session.id"
            [class.border-blue-500_30]="(activeSessionId$ | async) === session.id"
            class="group flex flex-col gap-1 p-3 rounded-lg hover:bg-white/5 cursor-pointer border border-transparent transition-all mb-1 relative">

            <div class="flex items-center justify-between">
                <span class="font-medium text-slate-200 truncate pr-4"
                    [class.text-blue-400]="(activeSessionId$ | async) === session.id">
                    {{ session.title }}
                </span>
                <span class="text-[10px] text-slate-500">{{ session.timestamp | date:'shortTime' }}</span>
            </div>

            <p class="text-xs text-slate-400 truncate line-clamp-1">
                {{ session.lastMessage || 'New conversation' }}
            </p>

            <!-- Hover Actions (Mock) -->
            <div
                class="absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-1 bg-slate-900/80 p-1 rounded backdrop-blur">
                <button class="p-1 hover:text-red-400 text-slate-400 transition-colors">
                    <lucide-icon [img]="icons.Trash2" class="w-3 h-3"></lucide-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- User Profile -->
    <div *ngIf="currentUser$ | async as user"
        class="p-4 border-t border-white/5 flex items-center gap-3 hover:bg-white/5 transition-colors cursor-pointer">
        <div
            class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center border border-slate-600 overflow-hidden relative">
            <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" class="w-full h-full object-cover">
            <span *ngIf="!user.avatarUrl" class="text-xs font-bold text-slate-300">
                {{ user.name ? user.name.slice(0, 2).toUpperCase() : 'AI' }}
            </span>
        </div>
        <div class="flex-1 min-w-0">
            <div class="font-medium text-sm text-slate-200 truncate">{{ user.name || user.domainAccount || 'User' }}
            </div>
            <div class="text-xs text-slate-500 truncate">{{ user.role || user.department || 'Guest' }}</div>
        </div>
        <lucide-icon [img]="icons.MoreHorizontal" class="w-4 h-4 text-slate-500"></lucide-icon>
    </div>
</div>
